<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04101A" />

    <!-- PWA: installierbar, eigenes Icon, Vollbild auf iOS. Relative Pfade
         funktionieren in Dev (Root) wie auf GitHub Pages (/bordbuch/). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bordbuch" />
    <script>
      // Tag/Nacht früh setzen (vor Render → kein Flash):
      // gespeicherte Wahl, sonst System-Präferenz prefers-color-scheme.
      (function () {
        try {
          var saved = localStorage.getItem('bordbuch-mode')
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.dataset.mode = saved || (prefersDark ? 'night' : 'day')
        } catch (e) {
          document.documentElement.dataset.mode = 'day'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <title>Bordbuch · MY «Seeluft»</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
